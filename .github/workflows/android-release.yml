name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OPEN_GBA_RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build signed APK
        env:
          OPEN_GBA_RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          OPEN_GBA_KEY_ALIAS: ${{ secrets.OPEN_GBA_KEY_ALIAS }}
          OPEN_GBA_KEYSTORE_PASSWORD: ${{ secrets.OPEN_GBA_KEYSTORE_PASSWORD }}
          OPEN_GBA_KEY_PASSWORD: ${{ secrets.OPEN_GBA_KEY_PASSWORD }}
        run: ./gradlew :lemuroid-app:assembleFreeBundleRelease --no-daemon --stacktrace

      - name: Prepare release metadata
        id: metadata
        env:
          APK_PATH: lemuroid-app/build/outputs/apk/freeBundle/release/lemuroid-app-free-bundle-release.apk
        run: |
          VERSION_NAME=$(grep -m1 'versionName = ' lemuroid-app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode = ' lemuroid-app/build.gradle.kts | sed -E 's/.*= ([0-9]+).*/\1/')
          test "v${VERSION_NAME}" = "${GITHUB_REF_NAME}"
          APK_NAME="OpenGBA-${VERSION_NAME}.apk"
          cp "$APK_PATH" "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          cat > update.json <<EOF
          {
            "packageName": "com.opengba.launcher",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}",
            "sha256": "${SHA256}",
            "notes": "OpenGBA ${VERSION_NAME}"
          }
          EOF
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.metadata.outputs.apk_name }}" update.json --generate-notes --title "OpenGBA ${GITHUB_REF_NAME}"
